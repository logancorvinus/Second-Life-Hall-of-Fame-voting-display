<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hall of Fame — Display Prototype</title>
<style>
:root{--gold:#d9b45f;--gold2:#8f6827;--black:#101010;--panel:#171717;--muted:#b9aa88;--green:#176b32;--red:#8f2424}
*{box-sizing:border-box}
body{margin:0;background:#080808;color:#f5f0e5;font-family:Georgia,"Times New Roman",serif}
.board{width:min(1100px,100%);margin:0 auto;padding:clamp(12px,2vw,26px);background:linear-gradient(145deg,#171717,#080808);border:3px solid var(--gold2);box-shadow:inset 0 0 0 2px #3b2a10,0 12px 40px #000}
.display{border:2px solid var(--gold);border-radius:10px;background:radial-gradient(ellipse at top,#242424,#101010 65%);padding:clamp(12px,2vw,24px);min-height:510px;display:flex;flex-direction:column}
.columns,.nominee{display:grid;grid-template-columns:minmax(160px,1.7fr) minmax(70px,.55fr) minmax(70px,.55fr) minmax(120px,.9fr) 82px 82px;gap:10px;align-items:center}
.columns{color:var(--gold);font-size:clamp(11px,1.4vw,15px);text-transform:uppercase;letter-spacing:.07em;padding:0 12px 12px;border-bottom:1px solid #705526}
.rows{flex:1;overflow-y:auto;max-height:440px;padding:4px 4px 4px 0;scrollbar-color:var(--gold2) #171717}
.nominee{padding:12px;border-bottom:1px solid #4b3a1b;min-height:58px;font-family:Arial,sans-serif;font-size:clamp(12px,1.5vw,16px)}
.nominee:nth-child(even){background:#ffffff08}
.name{font-weight:700;color:#f4e4bd;overflow-wrap:anywhere}
.stat{text-align:center;color:#e8dfce;font-variant-numeric:tabular-nums}
.approval{text-align:center;color:var(--gold);font-weight:700;font-variant-numeric:tabular-nums}
.vote{border:1px solid #d6bd83;border-radius:5px;padding:9px 4px;color:white;font-weight:700;cursor:pointer;background:var(--green)}
.vote.no{background:var(--red)}
.vote:disabled{opacity:.45;cursor:not-allowed}
.status{color:#c8b98f;font-size:11px;margin-top:4px;font-weight:400}
.empty{margin:auto;text-align:center;color:var(--muted);padding:40px 10px}
.controls{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-top:14px}
.control{min-height:58px;border:2px solid var(--gold);border-radius:8px;background:linear-gradient(#30240f,#100d08);color:#f2d58f;font:700 clamp(14px,2vw,20px) Georgia,serif;letter-spacing:.04em;cursor:pointer;box-shadow:inset 0 0 0 2px #5a421d}
.control:disabled{opacity:.35;cursor:not-allowed}
.pageinfo{text-align:center;color:var(--muted);font:12px Arial,sans-serif;margin-top:9px}
.note{text-align:center;color:#9f947c;font:11px Arial,sans-serif;margin:12px 0 0}
@media(max-width:650px){
 .columns,.nominee{grid-template-columns:minmax(100px,1.4fr) 42px 42px 70px 58px 58px;gap:5px}
 .nominee{padding:9px 5px}.vote{padding:8px 2px;font-size:11px}.columns{padding-left:5px;padding-right:5px}
 .display{min-height:450px}.rows{max-height:390px}
}
</style>
</head>
<body>
<main class="board">
  <section class="display" aria-label="Hall of Fame nominee display">
    <div class="columns">
      <div>Nominee</div><div style="text-align:center">Yes</div><div style="text-align:center">No</div><div style="text-align:center">Approval</div><div></div><div></div>
    </div>
    <div class="rows" id="rows"></div>
  </section>
  <nav class="controls" aria-label="Board controls">
    <button class="control" id="previous">◀ PREVIOUS</button>
    <button class="control" id="admin">ADMIN</button>
    <button class="control" id="next">NEXT ▶</button>
  </nav>
  <div class="pageinfo" id="pageinfo"></div>
  <p class="note">Visual prototype only — official voting security and records will be handled by the Second Life LSL script.</p>
</main>
<script>
const PAGE_SIZE=10;
let page=0;
let nominees=Array.from({length:13},(_,i)=>({id:i+1,name:`Sample Nominee ${i+1}`,yes:0,no:0,voted:false}));
const rows=document.getElementById('rows');
function render(){
 const pages=Math.max(1,Math.ceil(nominees.length/PAGE_SIZE));
 page=Math.min(Math.max(page,0),pages-1);
 const visible=nominees.slice(page*PAGE_SIZE,(page+1)*PAGE_SIZE);
 rows.innerHTML='';
 if(!visible.length){rows.innerHTML='<div class="empty">No nominees have been added yet.</div>';}
 visible.forEach(n=>{
   const total=n.yes+n.no, pct=total?Math.round(n.yes/total*100):0;
   const row=document.createElement('div');row.className='nominee';
   const name=document.createElement('div');name.className='name';name.textContent=n.name;
   const yes=document.createElement('div');yes.className='stat';yes.textContent=n.yes;
   const no=document.createElement('div');no.className='stat';no.textContent=n.no;
   const approval=document.createElement('div');approval.className='approval';approval.textContent=pct+'%';
   const yesBtn=document.createElement('button');yesBtn.className='vote';yesBtn.textContent='YES';
   const noBtn=document.createElement('button');noBtn.className='vote no';noBtn.textContent='NO';
   if(n.voted){yesBtn.disabled=true;noBtn.disabled=true;const s=document.createElement('div');s.className='status';s.textContent='Demo vote recorded';name.appendChild(s);}
   yesBtn.onclick=()=>cast(n,'yes');noBtn.onclick=()=>cast(n,'no');
   row.append(name,yes,no,approval,yesBtn,noBtn);rows.appendChild(row);
 });
 document.getElementById('previous').disabled=page===0;
 document.getElementById('next').disabled=page>=pages-1;
 document.getElementById('pageinfo').textContent=`Page ${page+1} of ${pages} · ${nominees.length} nominees`;
}
function cast(n,choice){
 if(n.voted){alert('A demo vote has already been recorded for this nominee.');return;}
 n.voted=true;if(choice==='yes')n.yes++;else n.no++;render();
}
document.getElementById('previous').onclick=()=>{if(page>0){page--;render();}};
document.getElementById('next').onclick=()=>{if((page+1)*PAGE_SIZE<nominees.length){page++;render();}};
document.getElementById('admin').onclick=()=>alert('ADMIN demo control. In Second Life, the LSL script will verify the avatar UUID before opening administrator functions.');
render();
</script>
</body>
</html>
